name: Verify Evaluator

on:
  push:
    branches:
      - '**'  # Run on all branches
    paths:
      - 'src/evaluator/**'
  pull_request:
    paths:
      - 'src/evaluator/**'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      
      - name: Run verify.py
        run: |
          cd src/evaluator
          uv run scripts/verify.py
